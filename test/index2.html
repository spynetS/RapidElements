<html>
  <head>
			<script defer src="../bin/RapidElements.js" type="text/javascript"></script>
	</head>


	
	<body>

		<template rapid-data="Counter" rapid-name="counter">
			<button onclick="{{props.click}}" >
					{{this.count}}
			</button>
			<input name="" type="text" value="" onkeypress="{{props.onkeyup}}" /> 
			<p>{{this.text}}</p>
		</template>

		
		<counter :onkeyup="this.text=(event.target.value);update()" :click="this.count++;console.log(this.text); window.update()" ></counter>
		<counter :onkeyup="this.text=(event.target.value);update()" :click="this.log()" ></counter>

		
		<div id="root"></div>

		<script type="text/javascript">
		 class Counter {
				 text = ""
				 count = 0

				 log(){
						 this.count++;
						 console.log(this.text);
						 window.update()
				 }
		 }
		</script>
		
	</body>
</html>
