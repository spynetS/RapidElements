<html>
  <head>
			<script defer src="../bin/RapidElements.js" type="text/javascript"></script>
	</head>


	
	<body>

		<template rapid-data="Counter" state='{"count":0}' rapid-name="counter">
			<button :onclick="console.log(this.count++)" >
					{{this.count}}
			</button>
		</template>

		
		<counter click="Click Me" ></counter>
		
		
		<div id="root"></div>

		<script type="text/javascript">
		 class Counter {
				 count = 0
		 }
		</script>
		
	</body>
</html>
