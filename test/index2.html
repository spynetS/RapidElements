<html>
  <head>

			<!-- <script defer src="/bin/RapidElements.js" type="text/javascript"></script> -->
			<!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->

	</head>


	
	<body class="bg-white">


			<template rapid-data="Counter" rapid-name="but">
					<button :onclick="this.log()" >
							{this.count}
					</button>
					<input name="" type="text" value="" :oninput="this.text=event.target.value;window.update()" />
					<p>{this.text}</p>
			</template>

			<template rapid-data="Popup" rapid-name="popup" >
					<div style="{props.open == 'true' ? 'display:flex' : 'display:none'}" >
							<p>HEJ HEJ</p>

							<button onclick="{props.setopen}; window.update()" >
									close
							</button>
							
							<but></but>
					</div>

					
			</template>

			<template rapid-name='app' rapid-data="App">
					<button :onclick="this.open = !this.open; window.update();console.log(this.open)" >
							Open
					</button>
					<popup :open="{this.open}" :setopen="this.open = false"  ></popup>
			</template>


			<app></app>
			
		<div id="root"></div>

		<script defer src="../bin/RapidElements.js" type="text/javascript"></script>
		<script defer type="text/javascript"></script>

		<script type="text/javascript">
		 class App {
				 open = false;
		 }
		 
		 class Popup {
				 
		 }
		 class Counter {
				 text = ""
				 count = 0
				 log(){
						 this.count++;
						 console.log(this.text);
						 window.update()
				 }
		 }
		</script>


		<div id="root"></div>
		
	</body>
</html>
