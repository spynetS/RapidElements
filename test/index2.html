<html>
  <head>

			<!-- <script defer src="/bin/RapidElements.js" type="text/javascript"></script> -->
			<!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->

	</head>

	<body class="bg-white">

			<div id="root"></div>

			<script src="../bin/RapidElements.js" type="text/javascript"></script>
			<script defer type="text/javascript" >

				let count = 0;
				function counter(){
						return new VElement('button',{ onclick:()=>{count++; window.render(app())}},[count.toString()])
				}
				
				function app(){
						return new VElement('div',{},[counter()]);
				}

			 window.render(app())
			 
			</script>
	</body>
</html>
